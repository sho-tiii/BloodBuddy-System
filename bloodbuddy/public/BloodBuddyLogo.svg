<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bloodDropGrad" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#E82B36" />
      <stop offset="40%" stop-color="#D31D27" />
      <stop offset="100%" stop-color="#A7111A" />
    </linearGradient>
    <linearGradient id="leftHandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#880D14" />
      <stop offset="100%" stop-color="#A8151E" />
    </linearGradient>
    <linearGradient id="rightHandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8A6A8" />
      <stop offset="100%" stop-color="#F38E91" />
    </linearGradient>
    <filter id="dropShadow" x="-12%" y="-12%" width="124%" height="128%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#880D14" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Group with subtle shadow -->
  <g filter="url(#dropShadow)">
    <!-- Main Red Blood Droplet -->
    <path d="M 120,24 C 120,24 178,92 178,142 C 178,174 152,198 120,198 C 88,198 62,174 62,142 C 62,92 120,24 120,24 Z" fill="url(#bloodDropGrad)" />
  </g>

  <!-- Medical Cross (+) at top -->
  <g fill="#FFFFFF">
    <rect x="116" y="46" width="8" height="24" rx="3" />
    <rect x="108" y="54" width="24" height="8" rx="3" />
  </g>

  <!-- Two figures embracing with heart cutout -->
  <g fill="#FFFFFF">
    <!-- Left Person Head -->
    <circle cx="96" cy="92" r="9" />
    <!-- Right Person Head -->
    <circle cx="144" cy="92" r="9" />
    
    <!-- Embracing Figures Body Silhouette -->
    <path d="M 82,148 C 82,120 86,106 100,103 C 105,110 112,114 120,114 C 128,114 135,110 140,103 C 154,106 158,120 158,148 C 148,162 136,168 120,168 C 104,168 92,162 82,148 Z" />
  </g>

  <!-- Red Heart between the figures -->
  <path d="M 120,140 C 120,140 106,128 106,118 C 106,112.5 110,108.5 115.5,108.5 C 118.5,108.5 120,110.5 120,110.5 C 120,110.5 121.5,108.5 124.5,108.5 C 130,108.5 134,112.5 134,118 C 134,128 120,140 120,140 Z" fill="#C0151E" />

  <!-- Left Cradling Hand / Swoosh (Deep Burgundy) -->
  <path d="M 115,212 C 92,209 64,193 48,164 C 43,154 42,145 44,138 C 45,135 48,137 49,141 C 55,160 72,183 95,194 C 104,198 113,201 118,203 C 119,207 117,210 115,212 Z" fill="url(#leftHandGrad)" />

  <!-- Right Cradling Hand / Swoosh (Soft Blush Rose) -->
  <path d="M 125,212 C 148,209 176,193 192,164 C 197,154 198,145 196,138 C 195,135 192,137 191,141 C 185,160 168,183 145,194 C 136,198 127,201 122,203 C 121,207 123,210 125,212 Z" fill="url(#rightHandGrad)" />
</svg>